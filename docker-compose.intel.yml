# Intel Quick Sync / VA-API passthrough for hardware-accelerated transcoding.
# Usage: docker compose -f docker-compose.yml -f docker-compose.intel.yml up -d
#
# Prerequisites:
#   - Intel GPU with Quick Sync support (6th gen+ or recent Arc/Xe)
#   - VA-API drivers installed on the host (intel-media-va-driver or i965-va-driver)
#   - /dev/dri device nodes available

services:
  aurora:
    devices:
      - /dev/dri:/dev/dri
    environment:
      TRANSCODE_HW_ACCEL: vaapi
