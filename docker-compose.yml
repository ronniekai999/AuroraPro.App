services:
  db:
    # pgvector/pgvector:pg16 is the upstream maintainer's image: stock Postgres 16
    # with the `vector` extension precompiled. Required by migration 014 for
    # semantic search; drop-in compatible otherwise.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aurora
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - aurora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  aurora:
    build:
      context: .
      args:
        VERSION: ${AURORA_VERSION:-dev}
    restart: unless-stopped
    ports:
      - "8484:8484"
    environment:
      DATABASE_URL: postgres://aurora:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/aurora?sslmode=disable
      # JWT_SECRET: Leave unset for auto-generation on first run, or set explicitly
      # JWT_SECRET: your-64-char-secret-here
      AURORA_HOST: 0.0.0.0
      AURORA_PORT: 8484
      AURORA_ALLOWED_ORIGINS: ${AURORA_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8484}
      SCANNER_WORKERS: 8
      TMDB_API_KEY: ${TMDB_API_KEY:?Set TMDB_API_KEY in .env}
      TVDB_API_KEY: ${TVDB_API_KEY:-}
      TVDB_PIN: ${TVDB_PIN:-}
      CACHE_IMAGE_DIR: /app/cache/images
      CACHE_TRANSCODE_DIR: /tmp/aurora-transcode
      CACHE_SUBTITLE_DIR: /app/cache/subtitles
      # Phase 3: Transcoding
      TRANSCODE_HW_ACCEL: ${TRANSCODE_HW_ACCEL:-auto}
      TRANSCODE_MAX_SESSIONS: ${TRANSCODE_MAX_SESSIONS:-0}
      TRANSCODE_PROFILES: ${TRANSCODE_PROFILES:-1080p,720p,480p}
      # Phase 5: Semantic search (local LLM via Ollama sidecar).
      # Setting LLM_ENABLED=false disables embedding + semantic search and falls
      # back to the existing trigram path; useful for low-RAM deployments.
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_OLLAMA_URL: ${LLM_OLLAMA_URL:-http://ollama:11434}
      LLM_EMBED_MODEL: ${LLM_EMBED_MODEL:-nomic-embed-text}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-qwen2.5:3b-instruct}
      LLM_EMBED_DIMS: ${LLM_EMBED_DIMS:-384}
      LLM_BACKFILL_WORKERS: ${LLM_BACKFILL_WORKERS:-2}
    # GPU Passthrough: Use override files instead of uncommenting blocks.
    #   NVIDIA: docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up
    #   Intel:  docker compose -f docker-compose.yml -f docker-compose.intel.yml up
    volumes:
      - ./migrations:/app/migrations:ro
      - ./static:/app/static:ro        # Mount static files for live frontend updates
      - aurora_data:/app/data          # Persists auto-generated secrets
      - aurora_cache:/app/cache        # Image and subtitle cache
      - ${MEDIA_PATH:-/path/to/your/media}:/media:ro  # Mount your media here
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  # Local LLM runtime for semantic search + natural-language query parsing.
  # CPU-only by default; see docker-compose.nvidia.yml for GPU passthrough.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Not published to the host by default — only the aurora container needs it.
    # Uncomment to expose for debugging: `ports: ["127.0.0.1:11434:11434"]`.
    expose:
      - "11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # One-shot init that pulls the embedding + chat models on first boot.
  # Idempotent: `ollama pull` no-ops if the model is already present in the
  # ollama_models volume, so restarts are fast.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_EMBED_MODEL: ${LLM_EMBED_MODEL:-nomic-embed-text}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-qwen2.5:3b-instruct}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Pulling embedding model: $$LLM_EMBED_MODEL"
        ollama pull "$$LLM_EMBED_MODEL"
        echo "Pulling chat model: $$LLM_CHAT_MODEL"
        ollama pull "$$LLM_CHAT_MODEL"
        echo "Models ready."
    restart: "no"

volumes:
  aurora_pgdata:
  aurora_data:
  aurora_cache:
  ollama_models:
