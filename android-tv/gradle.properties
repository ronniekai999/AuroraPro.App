org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# === AGP / AndroidX ===
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# The following android.* flags all trigger "this option is deprecated" warnings
# under AGP 9.1 because they pin values that have since become the default. We
# keep them set for one very specific reason: removing them flips AGP 9 into
# "built-in Kotlin" mode, which double-registers the `kotlin` Gradle extension
# against our explicit `kotlin-android` plugin and fails plugin-apply with:
#   Cannot add extension with name 'kotlin', as there is an extension already
#   registered with that name.
#
# Migrating off these flags is a P2 ticket — it requires:
#   1. Removing `alias(libs.plugins.kotlin.android)` from every module.
#   2. Verifying kotlin-compose / kotlin-serialization / ksp still apply cleanly
#      on top of AGP 9's built-in Kotlin (each has its own ordering expectations).
#   3. Checking that KotlinJvmCompile still honors the root subprojects block
#      that pins jvmTarget = JVM_17.
# Until then, the deprecation warnings are expected and benign.
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# === Kotlin / KSP ===
kotlin.code.style=official
ksp.incremental=true
