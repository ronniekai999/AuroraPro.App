# Centralized dependency version catalog. All modules pull from here — single
# source of truth for versions, avoids drift between modules.
[versions]
agp                     = "9.1.1"
kotlin                  = "2.2.10"
ksp                     = "2.3.2"
coroutines              = "1.10.1"
serialization           = "1.8.0"

compose-bom             = "2024.12.01"
# tv-material went alpha10 → beta01 (no alpha11 was ever published); latest stable is 1.0.1.
# tv-foundation froze at 1.0.0-rc01 — its APIs were folded back into regular compose-foundation.
compose-tv-material     = "1.0.1"
compose-tv-foundation   = "1.0.0-rc01"
navigation-compose      = "2.8.5"
activity-compose        = "1.9.3"
hilt                    = "2.54"
hilt-nav-compose        = "1.2.0"

retrofit                = "2.11.0"
okhttp                  = "4.12.0"
retrofit-kotlinx-serial = "1.0.0"

coil                    = "3.0.4"
media3                  = "1.5.1"

datastore               = "1.1.2"
room                    = "2.6.1"
security-crypto         = "1.1.0-alpha06"
lifecycle               = "2.8.7"
core-ktx                = "1.15.0"

junit                   = "5.11.4"
turbine                 = "1.2.0"
truth                   = "1.4.4"

[libraries]
# Kotlin / coroutines
kotlin-coroutines-core          = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "coroutines" }
kotlin-coroutines-android       = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlin-serialization-json       = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Compose BOM anchors all Compose dep versions (except compose-tv, which is separate)
compose-bom                     = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui                      = { module = "androidx.compose.ui:ui" }
compose-ui-tooling              = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview      = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation              = { module = "androidx.compose.foundation:foundation" }
compose-animation               = { module = "androidx.compose.animation:animation" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# Jetpack Compose for TV — separate artifact from regular Compose Material
compose-tv-foundation           = { module = "androidx.tv:tv-foundation",  version.ref = "compose-tv-foundation" }
compose-tv-material             = { module = "androidx.tv:tv-material",    version.ref = "compose-tv-material" }

activity-compose                = { module = "androidx.activity:activity-compose",         version.ref = "activity-compose" }
navigation-compose              = { module = "androidx.navigation:navigation-compose",      version.ref = "navigation-compose" }
lifecycle-viewmodel-compose     = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose       = { module = "androidx.lifecycle:lifecycle-runtime-compose",   version.ref = "lifecycle" }
core-ktx                        = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }

# Hilt DI
hilt-android                    = { module = "com.google.dagger:hilt-android",               version.ref = "hilt" }
hilt-compiler                   = { module = "com.google.dagger:hilt-android-compiler",      version.ref = "hilt" }
hilt-navigation-compose         = { module = "androidx.hilt:hilt-navigation-compose",        version.ref = "hilt-nav-compose" }

# Network stack
retrofit                        = { module = "com.squareup.retrofit2:retrofit",              version.ref = "retrofit" }
okhttp                          = { module = "com.squareup.okhttp3:okhttp",                  version.ref = "okhttp" }
okhttp-logging                  = { module = "com.squareup.okhttp3:logging-interceptor",     version.ref = "okhttp" }
retrofit-kotlinx-serialization  = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofit-kotlinx-serial" }

# Images
coil-compose                    = { module = "io.coil-kt.coil3:coil-compose",                version.ref = "coil" }
coil-network-okhttp             = { module = "io.coil-kt.coil3:coil-network-okhttp",         version.ref = "coil" }

# Media3 / ExoPlayer
media3-exoplayer                = { module = "androidx.media3:media3-exoplayer",             version.ref = "media3" }
media3-exoplayer-hls            = { module = "androidx.media3:media3-exoplayer-hls",         version.ref = "media3" }
media3-exoplayer-dash           = { module = "androidx.media3:media3-exoplayer-dash",        version.ref = "media3" }
media3-ui                       = { module = "androidx.media3:media3-ui",                    version.ref = "media3" }
media3-session                  = { module = "androidx.media3:media3-session",               version.ref = "media3" }

# Storage
datastore-preferences           = { module = "androidx.datastore:datastore-preferences",     version.ref = "datastore" }
room-runtime                    = { module = "androidx.room:room-runtime",                   version.ref = "room" }
room-ktx                        = { module = "androidx.room:room-ktx",                       version.ref = "room" }
room-compiler                   = { module = "androidx.room:room-compiler",                  version.ref = "room" }
security-crypto                 = { module = "androidx.security:security-crypto-ktx",        version.ref = "security-crypto" }

# Tests
junit-jupiter                   = { module = "org.junit.jupiter:junit-jupiter",              version.ref = "junit" }
turbine                         = { module = "app.cash.turbine:turbine",                     version.ref = "turbine" }
truth                           = { module = "com.google.truth:truth",                       version.ref = "truth" }
coroutines-test                 = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application    = { id = "com.android.application", version.ref = "agp" }
android-library        = { id = "com.android.library",     version.ref = "agp" }
kotlin-android         = { id = "org.jetbrains.kotlin.android",       version.ref = "kotlin" }
kotlin-compose         = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization   = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                    = { id = "com.google.devtools.ksp",              version.ref = "ksp" }
hilt                   = { id = "com.google.dagger.hilt.android",       version.ref = "hilt" }
