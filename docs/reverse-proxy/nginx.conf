# Aurora Media Server - Nginx Reverse Proxy Configuration
#
# Usage:
#   1. Copy this file to /etc/nginx/sites-available/aurora.conf
#   2. Update server_name and SSL certificate paths
#   3. ln -s /etc/nginx/sites-available/aurora.conf /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx

# This map block must be in the http {} context (before any server blocks)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream aurora_backend {
    server 127.0.0.1:8484;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name aurora.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aurora.example.com;

    # ── SSL ──────────────────────────────────────────────────────────
    ssl_certificate     /etc/ssl/certs/aurora.example.com.pem;
    ssl_certificate_key /etc/ssl/private/aurora.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── General settings ─────────────────────────────────────────────
    client_max_body_size 0;  # No upload size limit (for potential future uploads)

    # ── Default location (API, UI, WebSocket) ────────────────────────
    location / {
        proxy_pass http://aurora_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade support (for /ws endpoint)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    # ── Streaming location (disable buffering for HLS/direct play) ──
    #
    # Token hygiene: Chromecast/AirPlay receivers authenticate HLS requests
    # with a short-lived session-scoped token in the query string
    # (?token=...). Aurora redacts it from its own logs, but NGINX's default
    # $request log variable records the full URI — scrub it so cast tokens
    # never land in access logs. (Aurora only accepts cast-scoped tokens via
    # query param, so the exposure is one session for <=15 min, but clean
    # logs are still the right default.)
    location /api/stream/ {
        proxy_pass http://aurora_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Log the path without the query string (drops ?token=...).
        # Requires in the http {} context:
        #   log_format aurora_stream '$remote_addr - $remote_user [$time_local] '
        #                            '"$request_method $uri" $status $body_bytes_sent';
        # then uncomment:
        # access_log /var/log/nginx/aurora-stream.log aurora_stream;
    }
}
