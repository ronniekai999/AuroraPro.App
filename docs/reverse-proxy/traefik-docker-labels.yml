# Aurora Media Server - Traefik Docker Labels
#
# Usage:
#   Merge these labels into your aurora service definition in docker-compose.yml,
#   or use this as an override file:
#     docker compose -f docker-compose.yml -f docs/reverse-proxy/traefik-docker-labels.yml up -d
#
# Prerequisites:
#   - Traefik running as a Docker container with provider.docker enabled
#   - A certificate resolver named "letsencrypt" configured in Traefik
#   - The aurora service connected to Traefik's Docker network

services:
  aurora:
    labels:
      - "traefik.enable=true"

      # HTTP router - redirect to HTTPS
      - "traefik.http.routers.aurora-http.rule=Host(`aurora.example.com`)"
      - "traefik.http.routers.aurora-http.entrypoints=web"
      - "traefik.http.routers.aurora-http.middlewares=aurora-https-redirect"
      - "traefik.http.middlewares.aurora-https-redirect.redirectscheme.scheme=https"

      # HTTPS router
      - "traefik.http.routers.aurora.rule=Host(`aurora.example.com`)"
      - "traefik.http.routers.aurora.entrypoints=websecure"
      - "traefik.http.routers.aurora.tls=true"
      - "traefik.http.routers.aurora.tls.certresolver=letsencrypt"

      # Service port
      - "traefik.http.services.aurora.loadbalancer.server.port=8484"

      # Disable response buffering for streaming
      - "traefik.http.middlewares.aurora-buffering.buffering.maxResponseBodyBytes=0"
      - "traefik.http.routers.aurora.middlewares=aurora-buffering"

    networks:
      - traefik

networks:
  traefik:
    external: true
