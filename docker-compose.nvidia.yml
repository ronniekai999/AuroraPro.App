# NVIDIA GPU passthrough for hardware-accelerated transcoding (NVENC).
# Usage: docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
#
# Prerequisites:
#   - NVIDIA Container Toolkit installed on the host
#   - A supported NVIDIA GPU with NVENC capability

services:
  aurora:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      TRANSCODE_HW_ACCEL: nvenc

  # Ollama auto-detects the NVIDIA runtime and uses it for both embedding
  # and chat models. Embedding throughput jumps ~20x; chat parsing drops
  # from ~2s to ~150ms — semantic search becomes viable for type-ahead.
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
