name: CI

# The merge gate described in docs/dev-workflow.md, automated (August 2026
# playback review, item #1). Until this existed, `go build ./... && go test
# ./...` was a step a human remembered to run, and the ffmpeg-dependent tests
# only ever ran on machines that happened to have media tooling installed.
#
# Two things here are deliberate rather than incidental:
#
#   - ffmpeg is installed and AURORA_REQUIRE_MEDIA_TESTS=1 is set, which turns
#     every "ffmpeg not in PATH → t.Skip" guard into a hard failure. Without
#     that flag a container without ffmpeg reports a green run having executed
#     none of the playback matrix.
#   - Postgres carries the pgvector and pg_trgm extensions the schema needs, and
#     TEST_DATABASE_URL is exported, so the migration chain is actually applied
#     instead of skipped.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector's image is stock Postgres plus the `vector` extension that
        # migration 014 requires; pg_trgm (migration 001) ships with contrib.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: aurora
          POSTGRES_DB: aurora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora -d aurora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Turns the media-tooling skips into failures. See mediafixture_test.go.
      AURORA_REQUIRE_MEDIA_TESTS: "1"
      TEST_DATABASE_URL: postgres://aurora:aurora@localhost:5432/aurora_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          # Recorded in the log because distro builds differ in enabled
          # filters/encoders, and the playback matrix gates itself on those
          # capabilities rather than on a version number (August 2026 review §5).
          ffmpeg -hide_banner -version | head -1
          ffmpeg -hide_banner -encoders | grep -E ' (libx264|libx265|libsvtav1|aac|ac3|eac3) ' || true
          ffmpeg -hide_banner -filters  | grep -E ' (subtitles|zscale|tonemap|overlay) ' || true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Establish the schema BEFORE the suite. A large body of tests opts into
      # database mode purely by TEST_DATABASE_URL being set and assumes a
      # migrated schema is already there — and `go test ./...` runs packages
      # concurrently against the one database, so no package can be relied on
      # to migrate before another reads. Running the chain as its own step is
      # what makes that assumption true. RunMigrations is idempotent, so this
      # is also safe to re-run.
      - name: Apply migrations
        run: go test ./internal/db/ -run TestRunMigrations_AppliesFullChain -count=1 -v

      - name: Test
        run: go test ./... -timeout 20m

  web:
    name: SPA build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static/redesign/app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: static/redesign/app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck & build
        run: npm run build

      - name: Test
        run: npm test

  review-gate:
    name: Review gate self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The gate is the only thing standing between an unreviewed commit and
      # the remote, and its suite is the only thing standing between the gate
      # and a silent regression. Four review rounds each found a bypass the
      # suite did not model, so it runs here rather than when someone
      # remembers. It performs real pushes to a temp bare remote and asserts
      # what landed; no network, no dependence on this checkout's state.
      - name: Review gate tests
        run: bash scripts/review-gate-test.sh

      # Wrapper shapes, derived from each wrapper's documented option syntax
      # rather than from the implementation. Shipped unreferenced once, which
      # is the same as deleted — it cannot rot loudly if nothing runs it.
      - name: Review gate wrapper spec
        run: bash scripts/review-gate-wrapper-spec.sh

      # Guards the harnesses themselves. Twice a suite was green against a
      # gate that was genuinely broken, and "the tests pass" was quoted as
      # evidence both times. This applies known-bad patches and asserts each
      # one is caught by the suite or the spec.
      - name: Review gate mutation tests
        run: bash scripts/review-gate-mutation-test.sh

  # Deliberately NOT folded into review-gate above: these guard the deploy
  # scripts and the operator tooling, and a failure in either reported as
  # "Review gate self-test" sends the reader to the wrong file.
  operator-scripts:
    name: Deploy and operator script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The deploy scripts' Node gate. Three scripts carry their own copy of
      # node_vite_verdict(); this asserts they have not drifted and that all
      # three agree on a table of real version strings. A box ran Node 18 for
      # two weeks of failed updates because nothing checked the version before
      # npm did.
      - name: Node version gate tests
        run: bash scripts/node-version-test.sh

      # The pre-flight check an operator runs before starting Aurora on moved
      # media. It shipped untested, and two review rounds then found three
      # states where it printed "nothing would be pruned" while the scan would
      # delete rows and cascade the watch history away. None was visible to the
      # Go contract tests, which never run the script. This does: real temp
      # trees, a stubbed psql, and assertions on the exit codes an operator
      # acts on. Some cases drop privileges, so they need a non-root runner or
      # setpriv — ubuntu-latest runs unprivileged and takes the former path.
      - name: Library path check tests
        run: bash scripts/check-library-paths-test.sh

  review-record:
    name: Review record present
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The strongest of the three checks, which is not the same as binding:
      # this script and this workflow are tracked files in the branch under
      # review, so a branch can neuter either in one line. It blocks only once
      # an admin (a) requires this check in branch protection AND (b) requires
      # CODEOWNERS review on .github/** and scripts/review-gate*.sh. Until
      # both, it reports and nothing enforces. See CLAUDE.md's known limits.
      #
      # Through env, never interpolated into the script body: branch names may
      # legally contain quotes, ';' and '$( )', which would otherwise execute
      # on the runner. `git check-ref-format --branch 'main";id;"'` is VALID.
      - name: Check for an adversarial review record
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/review-gate-ci.sh "origin/$BASE_REF" "$HEAD_SHA"
