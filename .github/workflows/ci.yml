name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Go build / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./internal/...
      - run: go test ./internal/streaming/... ./internal/config/... ./internal/library/...

  frontend:
    name: Frontend typecheck / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static/redesign/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: static/redesign/app/package-lock.json
      - run: npm ci
      - run: npm run build
