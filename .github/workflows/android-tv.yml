name: Android TV

on:
  pull_request:
    paths: ['clients/android-tv/**', '.github/workflows/android-tv.yml']
  push:
    branches: [main]
    paths: ['clients/android-tv/**', '.github/workflows/android-tv.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint, and client contract tests
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: D-pad navigation and native playback on Android TV 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86
          target: android-tv
          profile: tv_1080p
          working-directory: clients/android-tv
          script: bash scripts/test-remote.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurorapro-tv-debug
          path: |
            clients/android-tv/app/build/outputs/apk/debug/*.apk
            clients/android-tv/app/build/reports/
          retention-days: 14
