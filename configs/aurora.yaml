# Aurora Media Server Configuration
# Environment variables override any value set here.
# See docs for the corresponding env var names.

server:
  host: "0.0.0.0"
  port: 8484
  allowed_origins:
    - "http://localhost:*"
    - "https://localhost:*"

database:
  url: "postgres://aurora:aurora@localhost:5432/aurora?sslmode=disable"
  max_conns: 10
  min_conns: 2

auth:
  # REQUIRED — generate with: openssl rand -hex 32
  jwt_secret: ""
  access_token_minutes: 5
  refresh_token_days: 30

scanner:
  workers: 8
  ffprobe_path: "ffprobe"
  watch_debounce_ms: 2000

tmdb:
  # REQUIRED — get one at https://www.themoviedb.org/settings/api
  api_key: ""
  metadata_refresh_hours: 168   # 7 days
  language: "en"                # ISO 639-1 code

tvdb:
  # OPTIONAL — get one at https://thetvdb.com/api-information
  # When provided, TVDB is used as a fallback for TV shows with low TMDB confidence.
  api_key: ""
  pin: ""                       # Optional subscriber PIN
  enabled: false                # Set true or provide api_key to enable
  language: "eng"               # ISO 639-3 code (eng, deu, jpn, etc.)

cache:
  image_dir: "/var/cache/aurora/images"
  transcode_dir: "/var/cache/aurora/transcode"
  subtitle_dir: "/var/cache/aurora/subtitles"

transcode:
  max_sessions: 0               # 0 = unlimited
  hw_accel: "auto"              # auto, nvenc, qsv, vaapi, amf, none
  hw_decode: "auto"             # auto (probe GPU decode at startup), off (encode-side accel only)
  # software_preset: "veryfast" # libx264 preset for SOFTWARE transcodes: ultrafast..medium ("faster" = quality-first)
  session_timeout_sec: 120
  segment_duration: 6
  profiles:
    - "1080p"
    - "720p"
    - "480p"

# watchparty:
#   2026-06 — the V2 sync tunables that used to live here
#   (heartbeat_interval_ms, time_sync_interval_ms, buffer_hysteresis_ms,
#   play_schedule_delay_ms, drift_*) configured a protocol that has been
#   removed. The V3 sync engine's tuning is built in (rate-adjust window
#   200ms–3s, 250ms ticks; see internal/watchparty DefaultSyncConfig).
#   Setting the old keys logs a startup warning and has no effect.
#   Voice (WebRTC) ICE/TURN settings are configured via env vars
#   (AURORA_VOICE_STUN_SERVERS / AURORA_TURN_URL / AURORA_TURN_USERNAME /
#   AURORA_TURN_CREDENTIAL) — see internal/config.
